services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: andrecomp
      POSTGRES_PASSWORD: andrecomp
      POSTGRES_DB: andrecomp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andrecomp -d andrecomp"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    # No `init: true` here on purpose. The image makes tini PID 1 itself
    # (Dockerfile ENTRYPOINT), which covers every launch path -- compose, plain
    # `docker run`, the quadlet units and the ECS task definition -- instead of
    # one lever per orchestrator. Setting it here too would nest docker-init
    # around tini and make tini warn that it is not PID 1 on every boot.
    # pids_limit is the backstop: if something ever does leak processes again,
    # this container hits its own ceiling and dies visibly rather than starving
    # the whole host of pids.
    pids_limit: 2048
    # Includes the shared 30s adapter-settlement window and final cleanup.
    stop_grace_period: 90s
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgres://andrecomp:andrecomp@db:5432/andrecomp
      PORT: "3100"
      SERVE_UI: "true"
      ANDRECOMP_DEPLOYMENT_MODE: "authenticated"
      ANDRECOMP_DEPLOYMENT_EXPOSURE: "private"
      ANDRECOMP_PUBLIC_URL: "${ANDRECOMP_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - andrecomp-data:/andrecomp
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  andrecomp-data:
